# Persistent Petitioner — petition automation from email. IMAP + optional Playwright signing.
# Designed for PostgreSQL (database name: petitions). No persistent storage required.
# Secrets: DATABASE_URL (required, e.g. postgresql://user:pass@host:5432/petitions), EMAIL_IMAP_HOST, EMAIL_USER, EMAIL_PASSWORD, USER_FIRST_NAME, USER_LAST_NAME, USER_EMAIL, USER_ZIP_CODE, USER_PHONE (optional).
# Use existingSecret, onepassworditem, or externalSecrets. See README.

nameOverride: ""
fullnameOverride: ""

replicas: 1

image:
  repository: docker.io/jb6magic/persistent-petitioner
  tag: "1.0"
  pullPolicy: IfNotPresent

secrets:
  existingSecret: persistent-petitioner
  onepassworditem:
    enabled: false
  externalSecrets:
    enabled: false
    refreshInterval: 1h
    secretStoreRef:
      name: onepassword-connect
      kind: ClusterSecretStore
    data: []

env:
  tz: US/Pacific
  automationEnabled: "false"
  emailCheckIntervalMinutes: "5"

# Persistence disabled by default — use PostgreSQL (DATABASE_URL in secret). Enable only if using SQLite.
persistence:
  enabled: false
  mountPath: /app/data
  existingClaim: ""
  size: 1Gi
  storageClass: ""

service:
  type: ClusterIP
  port: 8080

podAnnotations: {}

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 500m
